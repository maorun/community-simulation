[package]
name = "community-simulation"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.0"
strum = "0.28.0"
strum_macros = "0.28.0"
rand = "0.10"
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
indicatif = "0.18"
log = "0.4"
env_logger = "0.11"
flate2 = "1.0"
colored = "3.0"
rusqlite = "0.40"
petgraph = { version = "0.8", features = ["serde-1"] }
chrono = { version = "0.4", features = ["serde"] }
parquet = "59.0"
rand_distr = "0.6.0"
wasm-bindgen = { version = "0.2.127", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
inquire = "0.9"
rustyline = "18.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.1", features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3.10.1"
proptest = "1.4"
criterion = "0.8"

[[bench]]
name = "simulation_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
